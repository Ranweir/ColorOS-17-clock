name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      # Auto-detect project folder (works even if files are in a subfolder)
      - name: Find Gradle project
        id: find
        run: |
          SETTINGS=$(find . -name "settings.gradle.kts" -not -path "*/node_modules/*" | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "settings.gradle.kts not found. Repo contents:"
            find . -not -path "./.git/*" | head -50
            exit 1
          fi
          DIR=$(dirname "$SETTINGS")
          echo "Project dir: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        working-directory: ${{ steps.find.outputs.dir }}
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: GlassClock-debug-apk
          path: ${{ steps.find.outputs.dir }}/app/build/outputs/apk/debug/*.apk
